$schema: https://git.drupalcode.org/project/sdc/-/raw/1.x/src/metadata.schema.json
name: Menu
description: This is a keyboard supported accessible menu component
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
props:
  type: object
  properties:
    mobile_control:
      type: string
      title: Mobile Toggle
      description: If this menu has a collapse feature, pass the id of the button that toggles the collapse
    breakpoint:
      type: integer
      title: Menu Breakpoint
      description: The breakpoint at which the menu will switch from desktop to mobile
    menu_name:
      type: string
      title: Menu Name
      description: Machine name of the menu; used as a CSS modifier class on the list element.
    classes:
      type: array
      title: Item CSS Classes
      description: Additional CSS classes added to each menu <li> item.
      items:
        type: string
