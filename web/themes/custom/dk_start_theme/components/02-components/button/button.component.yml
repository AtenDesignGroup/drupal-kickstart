$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Button
description: A basic button component
status: stable
slots:
  icon_prefix:
    title: Prefix Icon
    description: Icon rendered before the link text.
  icon_suffix:
    title: Suffix Icon
    description: Icon rendered after the link text.
props:
  type: object
  properties:
    link:
      title: Link
      type: object
      properties:
        title:
          type: string
          title: Link Text
          examples:
            - Read more about this topic
            - Submit now
        url:
          title: Link Url
          type: string
          examples:
            - 'https://www.example.org'
