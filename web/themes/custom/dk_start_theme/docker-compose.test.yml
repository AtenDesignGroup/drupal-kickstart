services:
  test:
    image: cypress/included:15.8.1
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DRUPAL_DB_URL=mysql://drupal:drupal@db:3306/drupal
    depends_on:
      - db
    command: bash
  
  db:
    image: mariadb:10.6
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=drupal
      - MYSQL_USER=drupal
      - MYSQL_PASSWORD=drupal
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
