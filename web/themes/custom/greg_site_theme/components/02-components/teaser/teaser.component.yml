$schema: https://git.drupalcode.org/project/sdc/-/raw/1.x/src/metadata.schema.json
name: Teaser
status: 'experimental'
description: A Teaser component
props:
  type: object
  required:
    - title
  properties:
    variant:
      type: string
      title: Variant
      enum:
        - card
        - panel
    title:
      type: 'string'
      title: 'Title'
      examples:
        - 'A new exhibit opens at the Student Visitor Center'
    media:
      type: array
      title: Media
      description: 'The url for the image'
    link:
      type: 'object'
      title: 'More Link'
      properties:
        text:
          type: string
        url:
          type: string
    body:
      title: Body
      type: string
      examples:
        - '<p>The human body is a marvel and does so amazing things for us everyday.</p>'
