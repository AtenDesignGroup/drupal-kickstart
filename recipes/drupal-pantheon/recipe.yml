name: 'Drupal Pantheon'
description: 'Pantheon-specific modules and configuration for Drupal 11 projects.'
type: 'Site'

# Composer packages must be required before applying this recipe:
#   ddev composer require drupal/pantheon_advanced_page_cache:^2.3
#   ddev composer require pantheon-systems/drupal-integrations:^11
#   ddev composer require drupal/search_api_pantheon:^8.4
#   ddev composer require drupal/pantheon_secrets:^1.0
# drupal-kickstart.sh handles this automatically when PANTHEON=yes.

install:
  - pantheon_advanced_page_cache
  - redis
  - search_api_pantheon
  - pantheon_secrets

config:
  actions:
    system.performance:
      simple_config_update:
        # Pantheon handles CSS/JS aggregation at the CDN layer.
        css.preprocess: false
        js.preprocess: false
