name: '🔍 Formula: Solr'
description: 'Recipe to configure Search API Solr for local DDEV development.'
type: 'Site'

install:
  - search_api
  - search_api_solr

config:
  actions:
    search_api.server.local_solr_server:
      createIfNotExists:
        langcode: en
        status: true
        dependencies:
          module:
            - search_api_solr
        id: local_solr_server
        name: 'Local Solr Server'
        description: ''
        backend: search_api_solr
        backend_config:
          retrieve_data: false
          highlight_data: false
          site_hash: false
          server_prefix: ''
          domain: generic
          environment: default
          connector: standard
          connector_config:
            scheme: http
            host: solr
            port: 8983
            path: /
            core: dev
            timeout: 5
            index_timeout: 5
            optimize_timeout: 10
            finalize_timeout: 30
            skip_schema_check: false
            solr_version: '9'
            http_method: AUTO
            commit_within: 1000
            jmx: false
            jts: false
            solr_install_dir: ''
            username: solr
            password: SolrRocks
          optimize: false
          fallback_multiple: false
          disabled_field_types: {  }
          disabled_caches: {  }
          disabled_request_handlers:
            - request_handler_elevate_default_7_0_0
            - request_handler_replicationmaster_default_7_0_0
            - request_handler_replicationslave_default_7_0_0
          disabled_request_dispatchers:
            - request_dispatcher_httpcaching_default_7_0_0
          rows: 10
          index_single_documents_fallback_count: 10
          index_empty_text_fields: false
          suppress_missing_languages: true

    search_api.index.default_index:
      createIfNotExists:
        langcode: en
        status: true
        dependencies:
          config:
            - search_api.server.local_solr_server
          module:
            - node
            - search_api_solr
        id: default_index
        name: 'Default content index'
        description: ''
        read_only: false
        field_settings: {}
        datasource_settings:
          'entity:node':
            plugin_id: 'entity:node'
            settings:
              bundles:
                default: true
                selected: []
              languages:
                default: true
                selected: []
        processor_settings: {}
        tracker_settings:
          default:
            plugin_id: default
            settings:
              batch_size: 100
              indexing_order: fifo
        options:
          index_directly: false
          cron_limit: 50
        server: local_solr_server
        server_index_id: ''
