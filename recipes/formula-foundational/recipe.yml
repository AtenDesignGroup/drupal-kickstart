name: '🦄 🌈  Formula: Foundational'
description: 'Recipe to build foundational functionality in Drupal.'
type: 'Site'

install:
  # Core
  - breakpoint
  - ckeditor5
  - config
  - contextual
  - menu_link_content
  - datetime
  - block_content
  - editor
  - help
  - image
  - link
  - menu_ui
  - media
  - media_library
  - options
  - path
  - path_alias
  - telephone
  - taxonomy
  - shortcut
  - toolbar
  - field_ui
  - file
  - views
  - views_ui
  - automated_cron
  # Contrib modules - Content & Fields
  - entity_reference_revisions
  - field_config_cardinality
  - field_group
  - layout_paragraphs
  - paragraphs
  # Contrib modules - SEO & Discovery
  - google_tag
  - metatag
  - pathauto
  - redirect
  - simple_sitemap
  - token
  # Contrib modules - Search
  - search_api
  - search_api_exclude
  # Contrib modules - Content behavior
  - linkit
  - markerio
  - rabbit_hole
  # Contrib modules - Admin & UX
  - better_exposed_filters
  - config_ignore
  - editoria11y
  - environment_indicator
  - multiple_selects
  - role_delegation
  # Contrib modules - Development tools
  - twig_field_value
  - twig_tweak
  - webp
  # Themes
  - claro
  - gin
  - DK_THEME_NAME

config:
  strict: false
  actions:
    system.theme:
      simple_config_update:
        admin: 'claro'
        default: 'DK_THEME_NAME'