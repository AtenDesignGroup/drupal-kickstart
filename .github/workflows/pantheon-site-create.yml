name: Pantheon Site Create

# Provisions a new Pantheon site via Terminus.
# No code is pushed — this workflow handles infrastructure only.
# Run this before pantheon-project-deploy.yml when starting a new project.
#
# To find available upstream IDs for your org run:
#   terminus upstream:list --org="<your-org>" --framework=drupal
#
# Required secrets (pre-configured in repo settings, NOT workflow inputs):
#   PANTHEON_MACHINE_TOKEN  — Terminus authentication token
#
# Required variables (configured in repo/environment Settings → Variables):
#   PANTHEON_ORG            — Pantheon organization ID (used as --org flag)
#   PANTHEON_SITE           — Pantheon site machine name (e.g. my-client-site)

on:
  workflow_dispatch:
    inputs:
      site_label:
        description: 'Pantheon site human-readable label (e.g. "My Client Site")'
        required: true
        type: string
      upstream_id:
        description: 'Pantheon upstream ID. Use "empty" (default) since drupal-kickstart pushes its own fully-built project.'
        required: false
        type: string
        default: 'empty'
      php_version:
        description: 'PHP version'
        required: false
        type: string
        default: '8.3'

jobs:
  site-create:
    name: Create Pantheon Site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------------------------
      # Install PHP, Terminus, and authenticate.
      # -----------------------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}

      - name: Install Terminus
        run: |
          curl -L https://github.com/pantheon-systems/terminus/releases/latest/download/terminus.phar \
            -o /usr/local/bin/terminus
          chmod +x /usr/local/bin/terminus
          terminus --version

      - name: Authenticate Terminus
        run: terminus auth:login --machine-token="${{ secrets.PANTHEON_MACHINE_TOKEN }}"

      # -----------------------------------------------------------------------
      # Create the Pantheon site.
      # Uses the "empty" upstream by default — we push a fully-built Drupal 11
      # project from drupal-kickstart.sh, so we don't need Pantheon to scaffold
      # any framework files. An empty repo is cleaner for a full overwrite.
      # -----------------------------------------------------------------------
      - name: Create Pantheon site
        run: |
          terminus site:create \
            "${{ vars.PANTHEON_SITE }}" \
            "${{ inputs.site_label }}" \
            "${{ inputs.upstream_id }}" \
            --org="${{ vars.PANTHEON_ORG }}"

      # -----------------------------------------------------------------------
      # Poll until Pantheon's "Create Initial Site" provisioning workflow
      # completes. The drupal-11 upstream initialization typically takes
      # 30–90 seconds. Max ~15 retries × 15 sec = ~3.75 min timeout.
      # -----------------------------------------------------------------------
      - name: Wait for Pantheon site provisioning
        run: |
          echo "Waiting for Pantheon site provisioning to complete..."
          MAX=15
          for i in $(seq 1 $MAX); do
            STATUS=$(terminus workflow:list "${{ vars.PANTHEON_SITE }}" \
              --field=status 2>/dev/null | head -1 || true)
            echo "  Attempt ${i}/${MAX} — workflow status: ${STATUS:-unknown}"
            if [[ "$STATUS" == "succeeded" ]]; then
              echo "Provisioning complete."
              break
            fi
            if [[ $i -eq $MAX ]]; then
              echo "ERROR: Timeout waiting for Pantheon provisioning after $((MAX * 15)) seconds."
              exit 1
            fi
            sleep 15
          done

      # -----------------------------------------------------------------------
      # Switch the dev environment from SFTP mode (Pantheon default) to Git.
      # Must happen after provisioning completes.
      # -----------------------------------------------------------------------
      - name: Switch Pantheon dev to Git mode
        run: terminus connection:set "${{ vars.PANTHEON_SITE }}.dev" git

      # -----------------------------------------------------------------------
      # Echo the Pantheon git URL to the run log so the developer has it
      # available for pantheon-project-deploy.yml or local use.
      # -----------------------------------------------------------------------
      - name: Echo Pantheon git URL
        run: |
          GIT_URL=$(terminus connection:info "${{ vars.PANTHEON_SITE }}.dev" --field=git_url)
          echo ""
          echo "=========================================================="
          echo "  Pantheon site created and switched to Git mode."
          echo "  Site name : ${{ vars.PANTHEON_SITE }}"
          echo "  Dev URL   : https://dev-${{ vars.PANTHEON_SITE }}.pantheonsite.io"
          echo "  Git URL   : ${GIT_URL}"
          echo "=========================================================="
          echo ""
          echo "Next step: run pantheon-project-deploy.yml"

      - name: 'Verify: terminus site info'
        run: terminus site:info "${{ vars.PANTHEON_SITE }}"
