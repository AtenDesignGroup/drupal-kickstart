name: Pantheon Deploy Development

on:
  push:
    branches:
      - dk-start-build
env:
  PANTHEON_MULTIDEV: 'dev'
  GIT_COMMIT_MESSAGE: 'GitHub Actions Build'

jobs:
  build-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NodeJS with the version set in .nvmrc
        uses: actions/setup-node@v3
        with:
          node-version-file: '${{ vars.THEME_PATH }}/.nvmrc'
          cache: 'npm'
          cache-dependency-path: '${{ vars.THEME_PATH }}/package-lock.json'

      - name: Build Theme Artifact
        run: |
          cd ${{ vars.THEME_PATH }}
          npm install
          npm run build

      - name: Remove node_modules
        run: rm -rf ${{ vars.THEME_PATH }}/node_modules

      - name: Create build info file
        run: |
          cat > ${{ vars.THEME_PATH }}/build-info.txt << EOF
          Build Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Git Commit: ${{ github.sha }}
          Workflow Run ID: ${{ github.run_id }}
          Branch: ${{ github.ref }}
          Actor: ${{ github.actor }}
          EOF

      - name: Upload Theme Artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-artifact
          path: ${{ vars.THEME_PATH }}
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build-theme]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git Global Configs
        run: |
          git config --global pull.rebase false
          git config --global user.name "Aten CI Bot"
          git config --global user.email "ci@atendesigngroup.com"

      - name: Setup git remote
        run: git remote add remote ${{ vars.PANTHEON_GIT_REMOTE }}

      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Disable SSH Strict Host Key Checking
        run: 'printf "\nHost *\n\tStrictHostKeyChecking no" >> ~/.ssh/config'

      - name: Cache Composer dependencies to make builds faster
        uses: actions/cache@v3
        env:
          cache-name: cache-vendor
        with:
          path: ./vendor
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/composer.lock') }}

      - name: Make composer available and do a composer install
        uses: php-actions/composer@v6
        with:
          php_version: '8.3'
          php_extensions: 'gd sodium zip'
          dev: 'no'

      - name: Pre Deploy - Download Theme Artifact
        uses: actions/download-artifact@v4
        with:
          name: theme-artifact
          path: ${{ vars.THEME_PATH }}

      - name: Git Add
        run: git add -Af .

      - name: Git Commit
        run: git commit -q --no-verify -m '${{ env.GIT_COMMIT_MESSAGE }}'

      - name: Git Push
        run: git push --force remote HEAD:refs/heads/master

      # - name: Post Deploy - Notify Slack
      #   if: always()
      #   uses: AtenDesignGroup/aten-actions/.github/actions/post-deploy-notify-slack@main
      #   with:
      #     slack-channel-id: ${{ vars.SLACK_CHANNEL }}
      #     slack-message: "@${{ github.actor }} is pushing code today, and it was a ${{ job.status }}!\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}\nUsing Workflow: ${{ github.workflow }}\nPantheon: https://${{ env.PANTHEON_MULTIDEV }}-${{ vars.PANTHEON_SITE }}.pantheonsite.io"
      #     slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
